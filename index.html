<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stephen's Baseball Card Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lora:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="header-title">
        <img src="Cubical_Logo.jpg" alt="CubicalRuins logo" class="header-logo" />
        <div>
          <h1>Stephen's Baseball Card Database</h1>
          <p class="header-sub">A GitHub SQL repository by CubicalRuins.com</p>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat">
          <span class="stat-num" id="total-count">—</span>
          <span class="stat-label">Total cards</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="rc-count">—</span>
          <span class="stat-label">Rookie cards</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="total-value">—</span>
          <span class="stat-label">Est. value</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="controls">
      <input type="text" id="search" placeholder="Search by player, team, or set…" />
      <select id="filter-year"><option value="">All years</option></select>
      <select id="filter-brand"><option value="">All brands</option></select>
      <select id="filter-special">
        <option value="">All cards</option>
        <option value="rookie">Rookie cards only</option>
        <option value="auto">Autographs only</option>
      </select>
    </div>

    <p class="results-label" id="results-label"></p>
    <div class="card-grid" id="card-grid">
      <p class="loading">Loading collection…</p>
    </div>
  </main>

  <footer>
    <p>Hosted on GitHub Pages &mdash; updated as the collection grows</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
